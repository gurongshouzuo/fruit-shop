<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>古榕水果甄选小铺</title>
<style>
:root{
--green:#1f7a3d; --green-dark:#14532a; --green-soft:#e9f5ec;
--orange:#f26d00; --orange-dark:#d9480f; --orange-soft:#fff1e6;
--bg:#fbf7f0; --card:#ffffff; --text:#26221d; --muted:#8a8175;
--line:#efe6d6; --red:#d32f2f; --radius:18px;
--shadow-sm:0 2px 8px rgba(60,40,10,.06);
--shadow-md:0 8px 24px rgba(60,40,10,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5;}
button{font-family:inherit;}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
.app{max-width:480px; margin:0 auto; padding-bottom:104px;}
header{background:linear-gradient(140deg,#14532a 0%,#1f7a3d 55%,#2f9e4f 100%); color:#fff; padding:30px 22px 24px; border-radius:0 0 28px 28px; box-shadow:0 8px 24px rgba(20,83,42,.22);}
header h1{margin:0; font-size:26px; font-weight:800; letter-spacing:2px;}
header .tagline{display:inline-block; margin:10px 0 0; font-size:13px; line-height:1.5; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); padding:5px 12px; border-radius:999px;}
.notice{margin:14px 16px 0; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--orange); color:#6b5a44; font-size:13px; line-height:1.7; padding:11px 14px; border-radius:14px; box-shadow:var(--shadow-sm);}
main{padding:4px 16px 0;}
h2{font-size:18px; font-weight:800; letter-spacing:1px; margin:22px 2px 12px; display:flex; align-items:center; gap:8px;}
h2::before{content:""; width:5px; height:18px; background:linear-gradient(180deg,var(--green),#7cb342); border-radius:3px;}
.featured-list{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:none; scroll-snap-type:x mandatory;}
.featured-list::-webkit-scrollbar{display:none;}
.featured-list .card{flex:0 0 208px; scroll-snap-align:start;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm); position:relative; transition:transform .18s ease, box-shadow .18s ease;}
@media (hover:hover){ .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);} }
.pimg{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#f5efe6;}
.pimg-ph{width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:44px; background:linear-gradient(135deg,#e9f5ec,#fff1e6);}
.pbody{padding:12px 14px 14px;}
.pname{font-size:16px; font-weight:700; line-height:1.4;}
.pspec{font-size:12px; color:var(--muted); margin-top:4px; min-height:17px;}
.prow{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:10px;}
.price{color:var(--orange-dark); font-weight:800; font-size:18px; white-space:nowrap;}
.price small{font-size:12px; font-weight:400; color:var(--muted); margin-left:2px;}
.addbtn{border:none; background:linear-gradient(135deg,#f5852e,#ef6c00); color:#fff; font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; cursor:pointer; box-shadow:0 3px 10px rgba(239,108,0,.32); flex:none; white-space:nowrap; transition:filter .15s ease;}
.addbtn:active{filter:brightness(1.1);}
.addbtn:disabled{background:#ccc; box-shadow:none; cursor:not-allowed;}
.badge-soldout{position:absolute; top:10px; left:10px; background:rgba(30,25,20,.72); color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; backdrop-filter:blur(2px);}
.badge-featured{position:absolute; top:10px; right:10px; background:linear-gradient(135deg,#f5852e,#ef6c00); color:#fff; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; box-shadow:0 2px 8px rgba(239,108,0,.4);}
.card.soldout .pimg, .card.soldout .pimg-ph{filter:grayscale(1); opacity:.6;}
.state-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:32px 18px; text-align:center; color:var(--muted); font-size:14px; line-height:1.8; box-shadow:var(--shadow-sm);}
.state-box .big{font-size:42px; display:block; margin-bottom:8px;}
footer{padding:24px 16px 8px; text-align:center; color:var(--muted); font-size:12px; line-height:1.9;}
/* 底部购物车栏 */
#cartBar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.97); border-top:1px solid var(--line); box-shadow:0 -4px 20px rgba(60,40,10,.10);}
#cartBar .inner{max-width:480px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
#cartBar .sum{flex:1; cursor:pointer; min-width:0;}
#cartBar .count{font-size:13px; color:var(--muted);}
#cartBar .total{font-size:20px; font-weight:800; color:var(--orange-dark); margin-top:1px;}
#cartBar .total small{font-size:12px; color:var(--muted); font-weight:400;}
.btn{border:none; border-radius:999px; padding:12px 24px; font-size:15px; font-weight:700; cursor:pointer; transition:filter .15s ease;}
.btn:active{filter:brightness(1.08);}
.btn-orange{background:linear-gradient(135deg,#f5852e,#ef6c00); color:#fff; box-shadow:0 4px 14px rgba(239,108,0,.35);}
.btn-orange:disabled{background:#ccc; box-shadow:none; cursor:not-allowed;}
.btn-green{background:linear-gradient(135deg,#2f9e4f,#1f7a3d); color:#fff; box-shadow:0 4px 14px rgba(31,122,61,.3);}
.btn-ghost{background:#f5efe6; color:var(--text); box-shadow:none;}
/* 抽屉 / 弹窗通用 */
.overlay{position:fixed; inset:0; background:rgba(30,25,20,.45); z-index:60; display:none;}
.overlay.open{display:block;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:#fff; border-radius:24px 24px 0 0; max-width:480px; margin:0 auto; max-height:86vh; overflow-y:auto; padding:10px 18px calc(20px + env(safe-area-inset-bottom)); display:none; box-shadow:0 -8px 32px rgba(0,0,0,.16);}
.sheet::before{content:""; display:block; width:44px; height:5px; border-radius:999px; background:#e7ded0; margin:2px auto 14px;}
.sheet.open{display:block;}
.sheet h3{margin:0 0 14px; font-size:18px; font-weight:800; letter-spacing:.5px;}
.sheet .btn{width:100%; margin-top:8px;}
.close-x{position:absolute; top:16px; right:18px; border:none; background:#f5efe6; width:30px; height:30px; border-radius:50%; font-size:18px; line-height:1; color:var(--muted); cursor:pointer; z-index:2;}
.cart-item{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.cart-item img{width:58px; height:58px; object-fit:cover; border-radius:12px; background:#f5efe6;}
.cart-item .ci-info{flex:1; min-width:0;}
.cart-item .ci-name{font-size:15px; font-weight:700;}
.cart-item .ci-price{font-size:13px; color:var(--orange-dark); margin-top:3px;}
.stepper{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; flex:none;}
.stepper button{width:32px; height:32px; border:none; background:#fff; font-size:17px; cursor:pointer; color:var(--orange-dark); font-weight:700;}
.stepper button:active{background:var(--orange-soft);}
.stepper span{min-width:30px; text-align:center; font-size:14px; font-weight:700;}
.cart-total-row{display:flex; justify-content:space-between; align-items:center; margin:16px 0 6px; font-size:16px; font-weight:700;}
.cart-total-row .t{color:var(--orange-dark); font-size:22px;}
/* 详情弹窗 */
.modal{position:fixed; inset:0; z-index:61; display:none; align-items:flex-end; justify-content:center;}
.modal.open{display:flex;}
.modal-card{background:#fff; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:24px 24px 0 0; position:relative; box-shadow:0 -8px 32px rgba(0,0,0,.18);}
.modal-card img.big{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#f5efe6;}
.modal-body{padding:18px 20px calc(22px + env(safe-area-inset-bottom));}
.modal-body h3{margin:0; font-size:20px; font-weight:800;}
.modal-body .meta{color:var(--muted); font-size:13px; margin-top:8px; line-height:1.7;}
.modal-body .desc{font-size:14px; line-height:1.9; margin:12px 0 0; color:#4d463f;}
.modal-buy{display:flex; align-items:center; justify-content:space-between; margin-top:18px; gap:12px;}
.modal-buy .price{font-size:24px;}
/* 表单 */
.field{margin-bottom:16px;}
.field label{display:block; font-size:14px; font-weight:700; margin-bottom:7px;}
.field label .req{color:var(--red);}
.field input[type=text],.field input[type=tel],.field select{width:100%; border:1.5px solid #e2d8c8; border-radius:12px; padding:12px 13px; font-size:15px; background:#fff; outline:none; transition:border-color .15s ease, box-shadow .15s ease;}
.field input:focus,.field select:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(31,122,61,.12);}
.radio-row{display:flex; gap:8px; flex-wrap:wrap;}
.radio-pill{flex:1; min-width:120px; border:1.5px solid #e2d8c8; border-radius:12px; padding:12px 8px; text-align:center; font-size:14px; cursor:pointer; background:#fff; transition:border-color .15s ease, background .15s ease;}
.radio-pill.on{border-color:var(--green); background:var(--green-soft); color:var(--green-dark); font-weight:700;}
.err{color:var(--red); font-size:13px; min-height:18px; margin:4px 0 0;}
.order-summary{background:#faf6ef; border:1px solid var(--line); border-radius:14px; padding:14px; font-size:14px; line-height:1.9; margin-bottom:14px;}
/* 成功页 */
.success-wrap{text-align:center; padding:20px 10px 6px;}
.success-wrap .ok{font-size:56px; line-height:1;}
.success-wrap h3{margin:12px 0 4px; font-size:20px; font-weight:800;}
.success-wrap p{color:var(--muted); font-size:14px; line-height:1.8; margin:6px 0;}
.order-no{font-size:20px; font-weight:800; letter-spacing:1px; color:var(--green-dark); background:var(--green-soft); border-radius:12px; padding:12px; margin:16px 0;}
.hidden{display:none!important;}/* 前台轻动效包 */html,body{overflow-x:hidden;}header{position:sticky;top:0;z-index:50;transition:box-shadow .25s ease;}header.stuck{box-shadow:0 10px 24px rgba(20,83,42,.28);}.sk-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}.sk-img{aspect-ratio:1/1;background:#eee7d8;position:relative;overflow:hidden;}.sk-line{height:14px;border-radius:7px;background:#eee7d8;margin:12px 14px 0;position:relative;overflow:hidden;}.sk-line.short{width:55%;margin-bottom:14px;}.sk-img::after,.sk-line::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.75) 50%,transparent 80%);transform:translateX(-100%);animation:sk-sweep 1.6s ease-in-out infinite;}@keyframes sk-sweep{to{transform:translateX(100%);}}.card.reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease,box-shadow .18s ease;}.card.reveal.in{opacity:1;transform:none;}@media (hover:hover){.card.reveal.in:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}}img.pimg{opacity:0;transition:opacity .3s ease;}img.pimg.loaded{opacity:1;}.cart-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle;}.cart-badge.bump{animation:badge-bump .3s ease;}@keyframes badge-bump{0%{transform:scale(1);}40%{transform:scale(1.45);}100%{transform:scale(1);}}#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);z-index:80;background:rgba(30,25,20,.92);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;white-space:nowrap;max-width:92vw;}#toast.show{opacity:1;transform:translate(-50%,0);}.stepper .qty-num{display:inline-block;animation:qty-pop .25s ease;}@keyframes qty-pop{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}.overlay{transition:opacity .4s ease;opacity:0;}.overlay.open{opacity:1;}.sheet{display:block;visibility:hidden;transform:translateY(102%);transition:transform .4s ease,visibility .4s ease;}.sheet.open{visibility:visible;transform:translateY(0);}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;}.card.reveal{opacity:1!important;transform:none!important;}img.pimg{opacity:1!important;}.sk-img::after,.sk-line::after{display:none;}.sheet{transform:none!important;}}
</style>
</head>
<body>
<div class="app" id="shopView">
<header>
<h1>🍊 古榕水果甄选小铺</h1>
<p class="tagline">当天新鲜 · 甄选好果 · 天平学院门口自提</p>
</header>
<div class="notice" id="noticeBar">每天三趟配送：12:00 / 17:40 / 19:30 · 自提点在天平学院门口 · 只支持微信转账</div>
<main>
<section id="featuredSec" class="hidden">
<h2>今日推荐</h2>
<div id="featuredList" class="featured-list"></div>
</section>
<section>
<h2>全部商品</h2>
<div id="productGrid" class="grid"></div>
</section>
<div id="stateBox"></div>
</main>
<footer>
古榕水果甄选小铺 · 苏州科技大学天平学院<br>
下单后请把订单发到店主微信，店主确认后按时送达
</footer>
</div>

<div id="toast" role="status" aria-live="polite"></div><!-- 底部购物车栏 -->
<div id="cartBar">
<div class="inner">
<div class="sum" id="cartBarSum">
<div class="count" id="cartCount">购物车还是空的<span class="cart-badge hidden" id="cartBadge">0</span></div>
<div class="total" id="cartTotal"></div>
</div>
<button class="btn btn-orange" id="checkoutBtn" disabled>去结算</button>
</div>
</div>

<!-- 购物车抽屉 -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="cartSheet">
<button class="close-x" data-close>×</button>
<h3>我的购物车</h3>
<div id="cartItems"></div>
<div class="cart-total-row"><span>合计</span><span class="t" id="cartSheetTotal"></span></div>
<button class="btn btn-orange" id="goCheckoutBtn">去结算</button>
</div>

<!-- 商品详情弹窗 -->
<div class="overlay" id="detailOverlay"></div>
<div class="modal" id="detailModal">
<div class="modal-card">
<button class="close-x" data-close>×</button>
<div id="detailContent"></div>
</div>
</div>

<!-- 下单页（覆盖层） -->
<div class="sheet" id="checkoutSheet" style="max-height:92vh;">
<button class="close-x" data-close>×</button>
<h3>确认下单</h3>
<div class="order-summary" id="checkoutSummary"></div>
<form id="checkoutForm" novalidate>
<div class="field">
<label>姓名 <span class="req">*</span></label>
<input type="text" id="fName" placeholder="请填写收货人姓名" maxlength="20">
</div>
<div class="field">
<label>手机号 <span class="req">*</span></label>
<input type="tel" id="fPhone" placeholder="请填写 11 位手机号" maxlength="11" inputmode="numeric">
</div>
<div class="field">
<label>配送方式 <span class="req">*</span></label>
<div class="radio-row" id="deliveryTypeRow">
<div class="radio-pill on" data-value="pickup">自提 · 天平学院门口</div>
<div class="radio-pill" data-value="delivery">送到宿舍楼下</div>
</div>
</div>
<div class="field hidden" id="buildingField">
<label>宿舍楼号 <span class="req">*</span></label>
<input type="text" id="fBuilding" placeholder="例如：3号楼 502" maxlength="30">
</div>
<div class="field hidden" id="campusField">
<label>校区 <span class="req">*</span></label>
<div class="radio-row" id="campusRow">
<div class="radio-pill on" data-value="天平学院">天平学院</div>
<div class="radio-pill" data-value="江枫校区">江枫校区</div>
</div>
</div>
<div class="field">
<label>配送时间 <span class="req">*</span></label>
<div class="radio-row" id="slotRow">
<div class="radio-pill on" data-value="12:00">12:00</div>
<div class="radio-pill" data-value="17:40">17:40</div>
<div class="radio-pill" data-value="19:30">19:30</div>
</div>
</div>
<div class="field">
<label>付款方式 <span class="req">*</span></label>
<div class="radio-row" id="payRow">
<div class="radio-pill on" data-value="wechat">微信转账</div>
</div>
</div>
<p class="err" id="formErr"></p>
<button type="submit" class="btn btn-green" id="submitOrderBtn">提交订单</button>
</form>
</div>

<!-- 下单成功页（覆盖层） -->
<div class="sheet" id="successSheet">
<div class="success-wrap">
<div class="ok">✅</div>
<h3>下单成功！</h3>
<p>请把订单发到店主微信，店主确认后会按时送达。</p>
<div class="order-no" id="successOrderNo"></div>
<div class="order-summary" id="successSummary" style="text-align:left;"></div>
<button class="btn btn-orange" id="copyOrderBtn">一键复制订单发微信</button>
<button class="btn btn-ghost" id="backShopBtn" style="margin-top:10px;">返回继续逛逛</button>
<p class="err" id="copyTip"></p>
</div>
</div>

<script src="supabase.min.js"></script>
<script>
(function(){
"use strict";
var SUPABASE_URL = "https://rokaagkozrpkcsxfrgcj.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJva2FhZ2tvenJwa2NzeGZyZ2NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjYxODgsImV4cCI6MjExMDY0MjE4OH0.DNN4rLTCA2j4-G040lz6p_gjI8Gik7-AOtVDhtZFvR8";
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var DELIVERY_LABEL = { pickup: "自提（天平学院门口）", delivery: "送到宿舍楼下"};
var PAY_LABEL = { wechat: "微信转账"};

var products = [];
var cart = {};
try { cart = JSON.parse(localStorage.getItem("gr-cart") || "{}") || {};} catch(e){ cart = {};}

function $(id){ return document.getElementById(id);}
function money(n){ var v = Number(n || 0); return "¥" + (Math.round(v * 100) / 100).toString();}
function esc(s){ return String(s == null? "": s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function saveCart(){ try { localStorage.setItem("gr-cart", JSON.stringify(cart));} catch(e){}}
function productById(id){ for (var i = 0; i < products.length; i++) if (products[i].id === id) return products[i]; return null;}
function cartEntries(){
var list = [];
Object.keys(cart).forEach(function(id){
var p = productById(id);
var qty = cart[id];
if (p && qty > 0) list.push({ product: p, qty: qty});
});
return list;
}
function cartCount(){ var n = 0; cartEntries().forEach(function(e){ n += e.qty;}); return n;}
function cartTotal(){ var t = 0; cartEntries().forEach(function(e){ t += Number(e.product.price) * e.qty;}); return Math.round(t * 100) / 100;}

function imgHtml(p, cls){
if (p.image_url) return '<img class="' + cls + '" src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;' + cls + ' pimg-ph&quot;>🍊</div>\'">';
return '<div class="' + cls + ' pimg-ph">🍊</div>';
}

function renderProducts(){
var featured = products.filter(function(p){ return p.featured && p.status === "in_stock";});
var fSec = $("featuredSec");
if (featured.length){
fSec.classList.remove("hidden");
$("featuredList").innerHTML = featured.map(function(p){ return cardHtml(p, true);}).join("");
} else {
fSec.classList.add("hidden");
$("featuredList").innerHTML = "";
}
$("productGrid").innerHTML = products.map(function(p){ return cardHtml(p, false);}).join("");
bindCards(); observeReveals(); fadeProductImages();
}

function cardHtml(p, isFeatured){
var soldOut = p.status === "sold_out";
var cls = "card reveal" + (soldOut? " soldout": "");
var html = '<div class="' + cls + '" data-id="' + esc(p.id) + '">';
if (soldOut) html += '<span class="badge-soldout">已售罄</span>';
else if (isFeatured) html += '<span class="badge-featured">推荐</span>';
html += imgHtml(p, "pimg");
html += '<div class="pbody"><div class="pname">' + esc(p.name) + '</div>';
var specParts = [];
if (p.spec) specParts.push(esc(p.spec));
if (p.origin) specParts.push(esc(p.origin));
html += '<div class="pspec">' + (specParts.join(" · ") || "&nbsp;") + '</div>';
html += '<div class="prow"><span class="price">' + money(p.price) + '<small>/' + esc(p.unit || "份") + '</small></span>';
html += '<button class="addbtn" data-add="' + esc(p.id) + '"' + (soldOut? " disabled": "") + '>' + (soldOut? "已售罄": "加入") + '</button></div>';
html += '</div></div>';
return html;
}

function bindCards(){
document.querySelectorAll(".card").forEach(function(card){
card.addEventListener("click", function(e){
var addBtn = e.target.closest("[data-add]");
if (addBtn &&!addBtn.disabled){
e.stopPropagation();
addToCart(addBtn.getAttribute("data-add"), 1);
return;
}
openDetail(card.getAttribute("data-id"));
});
});
}

function observeReveals(){var cards=document.querySelectorAll("#featuredList .card.reveal, #productGrid .card.reveal");cards.forEach(function(card){var idx=Array.prototype.indexOf.call(card.parentNode.children,card);card.style.transitionDelay=Math.min(idx,7)*70+"ms";});if(!("IntersectionObserver" in window)){cards.forEach(function(c){c.classList.add("in");c.style.transitionDelay="0ms";});return;}var io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){var el=en.target;el.classList.add("in");io.unobserve(el);var d=parseInt(el.style.transitionDelay||"0",10)||0;setTimeout(function(){el.style.transitionDelay="0ms";el.classList.remove("reveal");el.classList.remove("in");},700+d);}});},{threshold:0.12});cards.forEach(function(c){io.observe(c);});}function fadeProductImages(){document.querySelectorAll("img.pimg").forEach(function(im){if(im.complete&&im.naturalWidth>0){im.classList.add("loaded");}else{im.addEventListener("load",function(){im.classList.add("loaded");});}});setTimeout(function(){document.querySelectorAll("img.pimg").forEach(function(im){im.classList.add("loaded");});},1500);}var toastTimer=null;function showToast(msg){var t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("show");if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");},2000);}function renderCartBar(){
var n = cartCount();
var t = cartTotal();
$("cartCount").textContent = n === 0? "购物车还是空的": "已选 " + n + " 件商品";
$("cartTotal").innerHTML = n === 0? "": "合计 " + money(t);
var badge = $("cartBadge"); if (badge){ badge.textContent = n; badge.classList.toggle("hidden", n === 0); } $("checkoutBtn").disabled = n === 0;
}

function addToCart(id, qty){
var p = productById(id);
if (!p || p.status === "sold_out") return;
cart[id] = (cart[id] || 0) + qty;
saveCart(); renderCartBar();
var badge = $("cartBadge"); if (badge){ badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump"); } showToast("已加入购物车"); var btn = document.querySelector('[data-add="' + id + '"]');
if (btn){ var old = btn.textContent; btn.textContent = "已加入 ✓"; setTimeout(function(){ btn.textContent = old;}, 900);}
}
function setQty(id, qty){
if (qty <= 0) delete cart[id]; else cart[id] = qty;
saveCart(); renderCartBar(); renderCartSheet();
}

function renderCartSheet(){
var entries = cartEntries();
if (!entries.length){
$("cartItems").innerHTML = '<div class="state-box"><span class="big">🧺</span>购物车还是空的<br>先挑几样好吃的水果吧</div>';
} else {
$("cartItems").innerHTML = entries.map(function(e){
var p = e.product;
return '<div class="cart-item">' +
(p.image_url? '<img src="' + esc(p.image_url) + '" alt="">': '<div style="width:56px;height:56px;border-radius:10px;background:#f5efe6;display:flex;align-items:center;justify-content:center;font-size:26px;">🍊</div>') +
'<div class="ci-info"><div class="ci-name">' + esc(p.name) + '</div><div class="ci-price">' + money(p.price) + '/' + esc(p.unit || "份") + '</div></div>' +
'<div class="stepper"><button data-dec="' + esc(p.id) + '">−</button><span class="qty-num">' + e.qty + '</span><button data-inc="' + esc(p.id) + '">＋</button></div>' +
'</div>';
}).join("");
}
$("cartSheetTotal").textContent = money(cartTotal());
$("goCheckoutBtn").disabled =!entries.length;
document.querySelectorAll("[data-inc]").forEach(function(b){
b.addEventListener("click", function(){ var p = productById(b.getAttribute("data-inc")); setQty(p.id, (cart[p.id] || 0) + 1);});
});
document.querySelectorAll("[data-dec]").forEach(function(b){
b.addEventListener("click", function(){ var p = productById(b.getAttribute("data-dec")); setQty(p.id, (cart[p.id] || 0) - 1);});
});
}

/* ---- 弹窗开关 ---- */
function openSheet(id){
closeAll();
$("overlay").classList.add("open");
$(id).classList.add("open");
}
function closeAll(){
["overlay","detailOverlay"].forEach(function(id){ $(id).classList.remove("open");});
["cartSheet","checkoutSheet","successSheet"].forEach(function(id){ $(id).classList.remove("open");});
$("detailModal").classList.remove("open");
}
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll);});
$("overlay").addEventListener("click", closeAll);
$("detailOverlay").addEventListener("click", closeAll);
$("cartBarSum").addEventListener("click", function(){ if (cartCount() > 0){ renderCartSheet(); openSheet("cartSheet");}});
$("checkoutBtn").addEventListener("click", function(){ if (cartCount() > 0){ renderCartSheet(); openSheet("cartSheet");}});
$("goCheckoutBtn").addEventListener("click", function(){ openCheckout();});

/* ---- 商品详情 ---- */
var detailQty = 1, detailId = null;
function openDetail(id){
var p = productById(id);
if (!p) return;
detailId = id; detailQty = 1;
var soldOut = p.status === "sold_out";
var html = "";
if (p.image_url) html += '<img class="big" src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '">';
else html += '<div class="big pimg-ph" style="aspect-ratio:4/3;">🍊</div>';
html += '<div class="modal-body"><h3>' + esc(p.name) + (soldOut? ' <span style="color:var(--red);font-size:14px;">（已售罄）</span>': '') + '</h3>';
var meta = [];
if (p.spec) meta.push("规格：" + esc(p.spec));
if (p.origin) meta.push("产地：" + esc(p.origin));
meta.push("单位：" + esc(p.unit || "份"));
html += '<div class="meta">' + meta.join(" &nbsp;·&nbsp; ") + '</div>';
if (p.description) html += '<p class="desc">' + esc(p.description) + '</p>';
html += '<div class="modal-buy"><span class="price">' + money(p.price) + '<small style="font-size:13px;color:var(--muted);font-weight:400;">/' + esc(p.unit || "份") + '</small></span>';
html += '<span class="stepper"><button id="dDec">−</button><span id="dQty" class="qty-num">1</span><button id="dInc">＋</button></span></div>';
html += '<button class="btn btn-orange" id="dAdd" style="width:100%;margin-top:14px;"' + (soldOut? " disabled": "") + '>' + (soldOut? "已售罄": "加入购物车") + '</button></div>';
$("detailContent").innerHTML = html;
$("detailOverlay").classList.add("open");
$("detailModal").classList.add("open");
$("dDec").addEventListener("click", function(){ if (detailQty > 1){ detailQty--; var q = $("dQty"); q.textContent = detailQty; q.classList.remove("qty-num"); void q.offsetWidth; q.classList.add("qty-num"); }});
$("dInc").addEventListener("click", function(){ detailQty++; var q = $("dQty"); q.textContent = detailQty; q.classList.remove("qty-num"); void q.offsetWidth; q.classList.add("qty-num"); });
$("dAdd").addEventListener("click", function(){
addToCart(detailId, detailQty);
closeAll();
renderCartSheet(); openSheet("cartSheet");
});
}

/* ---- 下单 ---- */
function pickValue(rowId){
var on = document.querySelector("#" + rowId + " .radio-pill.on");
return on? on.getAttribute("data-value"): null;
}
function bindRadioRow(rowId, onChange){
document.querySelectorAll("#" + rowId + " .radio-pill").forEach(function(pill){
pill.addEventListener("click", function(){
document.querySelectorAll("#" + rowId + " .radio-pill").forEach(function(x){ x.classList.remove("on");});
pill.classList.add("on");
if (onChange) onChange(pill.getAttribute("data-value"));
});
});
}
/* ---- 店铺设置（自提地址、配送校区、配送时间、公告；管理后台可改） ---- */
var SETTINGS = {
  pickup_address: "天平学院门口",
  delivery_campuses: ["天平学院", "江枫校区"],
  delivery_slots: ["12:00", "17:40", "19:30"],
  shop_notice: ""
};

function buildRadioRow(rowId, options, selectedValue){
  var row = $(rowId);
  if (!row) return;
  var sel = selectedValue;
  if (sel == null){
    var cur = row.querySelector(".radio-pill.on");
    if (cur) sel = cur.getAttribute("data-value");
  }
  row.innerHTML = options.map(function(opt, i){
    var on = (sel != null ? opt.value === sel : i === 0);
    return '<div class="radio-pill' + (on ? " on" : "") + '" data-value="' + esc(opt.value) + '">' + esc(opt.label) + "</div>";
  }).join("");
}

function syncDeliveryFields(){
  var isDel = pickValue("deliveryTypeRow") === "delivery";
  $("campusField").classList.toggle("hidden", !isDel);
  $("buildingField").classList.toggle("hidden", !isDel);
}

function buildCheckoutRows(){
  buildRadioRow("deliveryTypeRow", [
    { value: "pickup", label: "自提 · " + SETTINGS.pickup_address },
    { value: "delivery", label: "送到宿舍楼下" }
  ]);
  buildRadioRow("campusRow", SETTINGS.delivery_campuses.map(function(c){ return { value: c, label: c }; }));
  buildRadioRow("slotRow", SETTINGS.delivery_slots.map(function(s){ return { value: s, label: s }; }));
  bindRadioRow("deliveryTypeRow", function(v){ syncDeliveryFields(); });
  bindRadioRow("campusRow");
  bindRadioRow("slotRow");
  bindRadioRow("payRow");
  syncDeliveryFields();
}

function applySettings(){
  DELIVERY_LABEL.pickup = "自提（" + SETTINGS.pickup_address + "）";
  var notice = (SETTINGS.shop_notice && SETTINGS.shop_notice.trim())
    ? SETTINGS.shop_notice.trim()
    : ("每天三趟配送：" + SETTINGS.delivery_slots.join(" / ") + " · 自提点在" + SETTINGS.pickup_address + " · 只支持微信转账");
  $("noticeBar").textContent = notice;
  buildCheckoutRows();
}

function loadSettings(){
  client.from("fruit_settings").select("key,value").then(function(res){
    if (res.error || !res.data) return;
    res.data.forEach(function(row){
      if (!row || !row.key) return;
      if (row.key === "pickup_address" && typeof row.value === "string" && row.value.trim()) SETTINGS.pickup_address = row.value.trim();
      if (row.key === "delivery_campuses" && Array.isArray(row.value)) SETTINGS.delivery_campuses = row.value.filter(function(v){ return typeof v === "string" && v.trim(); });
      if (row.key === "delivery_slots" && Array.isArray(row.value)) SETTINGS.delivery_slots = row.value.filter(function(v){ return typeof v === "string" && v.trim(); });
      if (row.key === "shop_notice" && typeof row.value === "string") SETTINGS.shop_notice = row.value;
    });
    if (!SETTINGS.delivery_campuses.length) SETTINGS.delivery_campuses = ["天平学院", "江枫校区"];
    if (!SETTINGS.delivery_slots.length) SETTINGS.delivery_slots = ["12:00", "17:40", "19:30"];
    applySettings();
  });
}

buildCheckoutRows();

function orderSummaryText(o){
var lines = ["订单 " + o.order_no];
o.items.forEach(function(it){ lines.push(it.name + " " + money(it.price) + "/" + (it.unit || "份") + " ×" + it.qty);});
lines.push("合计：" + money(o.total));
lines.push("姓名：" + o.customer_name + " 电话：" + o.phone);
lines.push("配送：" + DELIVERY_LABEL[o.delivery_type] + (o.delivery_type === "delivery" ? (o.campus ? " · " + o.campus : "") + (o.building ? " · " + o.building : "") : ""));
lines.push("时间：" + o.delivery_slot);
lines.push("付款：" + PAY_LABEL[o.payment_method]);
return lines.join("\n");
}
function orderSummaryHtml(o){
var lines = o.items.map(function(it){
return "<div>" + esc(it.name) + " ×" + it.qty + " <span style='float:right;'>" + money(Number(it.price) * it.qty) + "</span></div>";
}).join("");
return lines + "<div style='border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;'><span>合计</span><strong style='color:var(--orange-dark);'>" + money(o.total) + "</strong></div>";
}

function openCheckout(){
var entries = cartEntries();
if (!entries.length) return;
var items = entries.map(function(e){ return { product_id: e.product.id, name: e.product.name, price: Number(e.product.price), unit: e.product.unit, qty: e.qty};});
var total = cartTotal();
$("checkoutSummary").innerHTML = orderSummaryHtml({ items: items, total: total});
$("formErr").textContent = "";
openSheet("checkoutSheet");
window._pendingOrder = { items: items, total: total};
}

$("checkoutForm").addEventListener("submit", function(ev){
ev.preventDefault();
var err = $("formErr");
var name = $("fName").value.trim();
var phone = $("fPhone").value.trim();
var deliveryType = pickValue("deliveryTypeRow");
var campus = pickValue("campusRow");
var building = $("fBuilding").value.trim();
var slot = pickValue("slotRow");
var pay = pickValue("payRow");
if (!name){ err.textContent = "请填写收货人姓名"; $("fName").focus(); return;}
if (!/^1[3-9]\d{9}$/.test(phone)){ err.textContent = "请填写正确的 11 位手机号"; $("fPhone").focus(); return;}
if (deliveryType === "delivery" &&!building){ err.textContent = "送到宿舍楼下需要填写楼号"; $("fBuilding").focus(); return;}
err.textContent = "";
var btn = $("submitOrderBtn");
btn.disabled = true; btn.textContent = "正在提交…";
var now = new Date();
function pad(n){ return (n < 10? "0": "") + n;}
var orderNo = "GR" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + pad(Math.floor(Math.random() * 90) + 10);
var pending = window._pendingOrder || { items: [], total: 0};
var order = {
order_no: orderNo,
customer_name: name,
phone: phone,
building: deliveryType === "delivery"? building: null,
campus: deliveryType === "delivery"? (campus || SETTINGS.delivery_campuses[0] || null): null,
delivery_slot: slot || "12:00",
delivery_type: deliveryType || "pickup",
payment_method: pay || "wechat",
items: pending.items,
total: pending.total,
status: "new"
};
client.from("fruit_orders").insert([order]).then(function(res){
btn.disabled = false; btn.textContent = "提交订单";
if (res.error){
err.textContent = "提交失败，请稍后再试（" + res.error.message + "）";
return;
}
cart = {}; saveCart(); renderCartBar();
window._lastOrder = order;
$("successOrderNo").textContent = "订单号：" + orderNo;
$("successSummary").innerHTML = orderSummaryHtml(order) +
"<div style='margin-top:10px;font-size:13px;color:var(--muted);line-height:1.8;'>" +
"姓名：" + esc(name) + " · 电话：" + esc(phone) + "<br>" +
"配送：" + esc(DELIVERY_LABEL[order.delivery_type]) + (order.delivery_type === "delivery" ? (order.campus ? " · " + esc(order.campus) : "") + (order.building ? " · " + esc(order.building) : "") : "") + "<br>" +
"时间：" + esc(order.delivery_slot) + " · 付款：" + esc(PAY_LABEL[order.payment_method]) + "</div>";
$("copyTip").textContent = "";
openSheet("successSheet");
});
});

$("copyOrderBtn").addEventListener("click", function(){
var o = window._lastOrder;
if (!o) return;
var text = orderSummaryText(o);
function done(ok){ $("copyTip").textContent = ok? "已复制，去微信粘贴发给店主吧 ✓": "复制失败，请长按手动复制";}
if (navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(function(){ done(true);}, function(){ fallbackCopy(text, done);});
} else {
fallbackCopy(text, done);
}
});
function fallbackCopy(text, done){
try {
var ta = document.createElement("textarea");
ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
document.body.appendChild(ta); ta.select();
var ok = document.execCommand("copy");
document.body.removeChild(ta);
done(ok);
} catch(e){ done(false);}
}
$("backShopBtn").addEventListener("click", function(){ closeAll();});

/* ---- 加载商品 ---- */
function loadProducts(){
var box = $("stateBox");
box.innerHTML = ""; var sk = ""; for (var i = 0; i < 4; i++) sk += '<div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>'; $("productGrid").innerHTML = sk; $("featuredSec").classList.add("hidden"); $("featuredList").innerHTML = "";
client.from("products").select("*").order("sort_order", { ascending: true}).order("created_at", { ascending: true}).then(function(res){
if (res.error){
$("productGrid").innerHTML = ""; box.innerHTML = '<div class="state-box"><span class="big">😕</span>商品加载失败，请检查网络后重试<div style="margin-top:12px;"><button class="btn btn-orange" onclick="location.reload()">重新加载</button></div></div>';
return;
}
products = res.data || [];
box.innerHTML = "";
if (!products.length){
box.innerHTML = '<div class="state-box"><span class="big">🧺</span>今天还没有商品上架<br>稍后再来看看新鲜好果～</div>';
}
renderProducts();
renderCartBar();
});
}
renderCartBar();
loadSettings();
window.addEventListener("scroll", function(){ var h = document.querySelector("header"); if (h) h.classList.toggle("stuck", window.scrollY > 8); }, { passive: true }); loadProducts();
})();
</script>
