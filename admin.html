<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 古榕水果甄选小铺</title>
<style>
:root{
--green:#1f7a3d; --green-dark:#14532a; --green-soft:#e9f5ec;
--orange:#f26d00; --orange-dark:#d9480f; --orange-soft:#fff1e6;
--bg:#fbf7f0; --card:#ffffff; --text:#26221d; --muted:#8a8175;
--line:#efe6d8; --red:#d32f2f; --radius:18px;
--shadow-sm:0 2px 8px rgba(60,40,10,.06);
--shadow-md:0 8px 24px rgba(60,40,10,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5;}
button{font-family:inherit;}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
.app{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
header{background:linear-gradient(140deg,#14532a 0%,#1f7a3d 55%,#2f9e4f 100%); color:#fff; padding:26px 22px 22px; border-radius:0 0 28px 28px; margin-bottom:18px; box-shadow:0 8px 24px rgba(20,83,42,.22);}
header h1{margin:0; font-size:22px; font-weight:800; letter-spacing:1px;}
header p{display:inline-block; margin:10px 0 0; font-size:13px; line-height:1.5; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); padding:5px 12px; border-radius:999px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow-sm);}
.card h2{margin:0 0 14px; font-size:18px; font-weight:800; letter-spacing:.5px;}
.btn{border:none; border-radius:999px; padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer; transition:filter .15s ease; white-space:nowrap;}
.btn:active{filter:brightness(1.08);}
.btn-orange{background:linear-gradient(135deg,#f5852e,#ef6c00); color:#fff; box-shadow:0 4px 14px rgba(239,108,0,.35);}
.btn-green{background:linear-gradient(135deg,#2f9e4f,#1f7a3d); color:#fff; box-shadow:0 4px 14px rgba(31,122,61,.3);}
.btn-ghost{background:#f5efe6; color:var(--text); box-shadow:none;}
.btn-danger{background:#fff; color:var(--red); border:1.5px solid #f0b4b4; box-shadow:none;}
.btn-sm{padding:7px 13px; font-size:13px;}
.btn:disabled{background:#ccc; box-shadow:none; cursor:not-allowed;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:14px; font-weight:700; margin-bottom:7px;}
.field label .req{color:var(--red);}
.field input[type=text], .field input[type=email], .field input[type=password], .field input[type=number], .field textarea, .field select{width:100%; border:1.5px solid #e2d8c8; border-radius:12px; padding:12px 13px; font-size:15px; background:#fff; outline:none; transition:border-color .15s ease, box-shadow .15s ease;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(31,122,61,.12);}
.field textarea{resize:vertical; min-height:64px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.check-row{display:flex; gap:18px; align-items:center; font-size:14px;}
.check-row label{font-weight:400; display:flex; align-items:center; gap:6px;}
.err{color:var(--red); font-size:13px; min-height:18px; margin:6px 0;}
.ok-msg{color:var(--green-dark); font-size:13px; font-weight:600; min-height:18px; margin:6px 0;}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.topbar .who{font-size:13px; color:var(--muted);}
.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tab{border:1.5px solid #e2d8c8; background:#fff; border-radius:999px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; transition:all .15s ease;}
.tab.on{background:linear-gradient(135deg,#2f9e4f,#1f7a3d); border-color:transparent; color:#fff; font-weight:700; box-shadow:0 3px 10px rgba(31,122,61,.3);}
.hidden{display:none !important;}
/* 商品行 */
.prow{display:flex; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);}
.prow:last-child{border-bottom:none;}
.prow img{width:58px; height:58px; object-fit:cover; border-radius:12px; background:#f5efe6; flex-shrink:0;}
.prow .pi{flex:1; min-width:0;}
.prow .pn{font-size:15px; font-weight:700;}
.prow .pm{font-size:13px; color:var(--muted); margin-top:4px;}
.pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; margin-left:6px; white-space:nowrap;}
.pill.in{background:var(--green-soft); color:var(--green-dark);}
.pill.out{background:#fce4ec; color:var(--red);}
.pill.feat{background:var(--orange-soft); color:var(--orange-dark);}
.prow .acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
/* 订单 */
.order{border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; box-shadow:var(--shadow-sm);}
.order .oh{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center;}
.order .ono{font-weight:800; font-size:15px;}
.order .ot{font-size:12px; color:var(--muted);}
.order .ol{font-size:14px; line-height:1.9; margin-top:10px;}
.order .oi{background:#faf6ef; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.8; margin-top:10px;}
.status-new{background:#fff1e6; color:#d9480f;}
.status-confirmed{background:#e3f2fd; color:#1565c0;}
.status-ready{background:#f3e5f5; color:#7b1fa2;}
.status-done{background:#e9f5ec; color:#14532a;}
.status-cancelled{background:#f5f5f5; color:#9e9e9e;}
.order .oacts{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.preview-img{max-width:180px; max-height:180px; border-radius:12px; display:block; margin-top:10px;}
.muted{color:var(--muted); font-size:13px; line-height:1.8;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--green-soft); color:var(--green-dark); border:1px solid #c8e6c9; border-radius:999px; padding:7px 8px 7px 13px; font-size:14px; font-weight:600;}
.chip button{border:none; background:none; color:var(--red); font-size:16px; cursor:pointer; line-height:1; padding:0;}
#sCampusInput, #sSlotInput{flex:1; border:1.5px solid #e2d8c8; border-radius:12px; padding:12px 13px; font-size:15px; outline:none; min-width:0;}
#sCampusInput:focus, #sSlotInput:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(31,122,61,.12);}
.login-box{max-width:420px; margin:40px auto 0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍊 古榕水果甄选小铺 · 管理后台</h1>
    <p>上架商品、管理订单都在这里 · 改完顾客立刻看到</p>
  </header>

  <!-- 登录 -->
  <div id="loginView" class="card login-box">
    <h2>店主登录</h2>
    <p class="muted">用店主邮箱和密码登录。密码只在登录时使用，不会保存在页面里。</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="loginEmail" value="1605572595@qq.com" placeholder="店主邮箱">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="登录密码" autocomplete="current-password">
      </div>
      <p class="err" id="loginErr"></p>
      <button type="submit" class="btn btn-green" id="loginBtn" style="width:100%;">登录</button>
    </form>
  </div>

  <!-- 管理区 -->
  <div id="adminView" class="hidden">
    <div class="topbar">
      <span class="who" id="whoText"></span>
      <span>
        <a class="btn btn-ghost btn-sm" href="index.html" style="text-decoration:none;">去看店铺前台 →</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
      </span>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabProducts">商品管理</button>
      <button class="tab" id="tabOrders">订单管理 <span id="newOrderCount"></span></button>
      <button class="tab" id="tabSettings">店铺设置</button>
    </div>

    <!-- 商品管理 -->
    <div id="productsPane">
      <div class="card">
        <h2 id="formTitle">新增商品</h2>
        <form id="productForm" novalidate>
          <input type="hidden" id="pId">
          <div class="field">
            <label>商品名 <span class="req">*</span></label>
            <input type="text" id="pName" placeholder="例如：脆蜜金柑" maxlength="30">
          </div>
          <div class="field-row">
            <div class="field">
              <label>价格（元） <span class="req">*</span></label>
              <input type="number" id="pPrice" placeholder="例如：9.9" min="0" step="0.01">
            </div>
            <div class="field">
              <label>单位 <span class="req">*</span></label>
              <select id="pUnit">
                <option value="半斤">半斤</option>
                <option value="盒">盒</option>
                <option value="份">份</option>
                <option value="斤">斤</option>
                <option value="个">个</option>
                <option value="箱">箱</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>规格（重量）</label>
              <input type="text" id="pSpec" placeholder="例如：250g" maxlength="20">
            </div>
            <div class="field">
              <label>产地 / 品种</label>
              <input type="text" id="pOrigin" placeholder="例如：越南" maxlength="20">
            </div>
          </div>
          <div class="field">
            <label>一句话介绍</label>
            <textarea id="pDesc" placeholder="例如：纯甜爆汁" maxlength="120"></textarea>
          </div>
          <div class="field">
            <label>商品图片</label>
            <input type="file" id="pImageFile" accept="image/*">
            <img id="pImagePreview" class="preview-img hidden" alt="商品图预览">
            <input type="hidden" id="pImageUrl">
            <p class="muted" id="uploadTip">选图后点保存时一起上传；不选图就用原来的图。</p>
          </div>
          <div class="field-row">
            <div class="field">
              <label>状态</label>
              <select id="pStatus">
                <option value="in_stock">在售</option>
                <option value="sold_out">售罄</option>
              </select>
            </div>
            <div class="field">
              <label>排序（数字越小越靠前）</label>
              <input type="number" id="pSort" value="0" min="0" step="1">
            </div>
          </div>
          <div class="field check-row">
            <label><input type="checkbox" id="pFeatured"> 设为今日推荐</label>
          </div>
          <p class="err" id="productErr"></p>
          <p class="ok-msg" id="productOk"></p>
          <button type="submit" class="btn btn-orange" id="saveProductBtn">保存商品</button>
          <button type="button" class="btn btn-ghost" id="resetFormBtn">清空表单</button>
        </form>
      </div>
      <div class="card">
        <h2>商品列表</h2>
        <div id="productList"></div>
      </div>
    </div>

    <!-- 订单管理 -->
    <div id="ordersPane" class="hidden">
      <div class="card">
        <h2>订单列表 <span class="muted" style="font-weight:400;">（最新在前）</span></h2>
        <button class="btn btn-ghost btn-sm" id="refreshOrdersBtn">刷新订单</button>
        <p class="err" id="ordersErr"></p>
        <div id="orderList" style="margin-top:12px;"></div>
      </div>
    </div>

    <!-- 店铺设置 -->
    <div id="settingsPane" class="hidden">
      <div class="card">
        <h2>店铺设置</h2>
        <p class="muted">自提地址、配送校区、配送时间和公告都在这里改，保存后顾客那边立刻生效。</p>
        <div class="field">
          <label>自提地址</label>
          <input type="text" id="sPickup" placeholder="例如：天平学院门口" maxlength="40">
        </div>
        <div class="field">
          <label>配送校区（点 × 删除）</label>
          <div id="sCampusChips" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;"></div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="sCampusInput" placeholder="输入新校区名，例如：江枫校区" maxlength="20">
            <button type="button" class="btn btn-ghost" id="sCampusAdd">添加</button>
          </div>
        </div>
        <div class="field">
          <label>配送时间（点 × 删除）</label>
          <div id="sSlotChips" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;"></div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="sSlotInput" placeholder="例如：20:00" maxlength="10">
            <button type="button" class="btn btn-ghost" id="sSlotAdd">添加</button>
          </div>
        </div>
        <div class="field">
          <label>店铺公告（显示在店铺顶部，留空则显示默认的配送信息）</label>
          <input type="text" id="sNotice" placeholder="例如：今天金柑刚到，数量不多" maxlength="100">
        </div>
        <p class="err" id="settingsErr"></p>
        <p class="ok-msg" id="settingsOk"></p>
        <button type="button" class="btn btn-orange" id="saveSettingsBtn">保存设置</button>
      </div>
    </div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL = "https://rokaagkozrpkcsxfrgcj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJva2FhZ2tvenJwa2NzeGZyZ2NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjYxODgsImV4cCI6MjExMDY0MjE4OH0.DNN4rLTCA2j4-G040lz6p_gjI8Gik7-AOtVDhtZFvR8";
  var BUCKET = "fruit-images";
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var DELIVERY_LABEL = { pickup: "自提（天平学院门口）", delivery: "送到宿舍楼下" };
  var PAY_LABEL = { wechat: "微信转账" };
  var STATUS_LABEL = { new: "待接单", confirmed: "已接单", ready: "待取货", done: "已完成", cancelled: "已取消" };
  function statusLabel(o){ if (o.status === "ready") return o.delivery_type === "delivery" ? "待送出" : "待取货"; return STATUS_LABEL[o.status] || o.status; }

  function $(id){ return document.getElementById(id); }
  function money(n){ var v = Number(n || 0); return "¥" + (Math.round(v * 100) / 100).toString(); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtTime(t){ if (!t) return ""; var d = new Date(t); function p(n){ return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }

  /* ---------- 登录 ---------- */
  function showAdmin(user){
    $("loginView").classList.add("hidden");
    $("adminView").classList.remove("hidden");
    $("whoText").textContent = "已登录：" + (user && user.email ? user.email : "");
    loadProducts(); loadOrders(); loadSettings();
  }
  function showLogin(){
    $("adminView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }
  $("loginForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var err = $("loginErr");
    var email = $("loginEmail").value.trim();
    var password = $("loginPassword").value;
    if (!email || !password){ err.textContent = "请填写邮箱和密码"; return; }
    err.textContent = "";
    var btn = $("loginBtn"); btn.disabled = true; btn.textContent = "登录中…";
    client.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      btn.disabled = false; btn.textContent = "登录";
      if (res.error){ err.textContent = "登录失败：" + res.error.message; return; }
      $("loginPassword").value = "";
      showAdmin(res.data.user);
    });
  });
  $("logoutBtn").addEventListener("click", function(){
    client.auth.signOut().then(function(){ showLogin(); });
  });

  /* ---------- 标签页 ---------- */
  function showPane(which){
    $("tabProducts").classList.toggle("on", which === "products");
    $("tabOrders").classList.toggle("on", which === "orders");
    $("tabSettings").classList.toggle("on", which === "settings");
    $("productsPane").classList.toggle("hidden", which !== "products");
    $("ordersPane").classList.toggle("hidden", which !== "orders");
    $("settingsPane").classList.toggle("hidden", which !== "settings");
  }
  $("tabProducts").addEventListener("click", function(){ showPane("products"); });
  $("tabOrders").addEventListener("click", function(){ showPane("orders"); loadOrders(); });
  $("tabSettings").addEventListener("click", function(){ showPane("settings"); });
  $("refreshOrdersBtn").addEventListener("click", loadOrders);

  /* ---------- 商品 ---------- */
  function loadProducts(){
    client.from("products").select("*").order("sort_order", { ascending: true }).order("created_at", { ascending: true }).then(function(res){
      if (res.error){ $("productList").innerHTML = "<p class='err'>商品加载失败：" + esc(res.error.message) + "</p>"; return; }
      var list = res.data || [];
      if (!list.length){ $("productList").innerHTML = "<p class='muted'>还没有商品，先在上面新增一款吧。</p>"; return; }
      $("productList").innerHTML = list.map(function(p){
        return '<div class="prow">' +
          (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="">' : '<div style="width:56px;height:56px;border-radius:10px;background:#f5efe6;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">🍊</div>') +
          '<div class="pi"><div class="pn">' + esc(p.name) +
          '<span class="pill ' + (p.status === "in_stock" ? "in" : "out") + '">' + (p.status === "in_stock" ? "在售" : "售罄") + '</span>' +
          (p.featured ? '<span class="pill feat">推荐</span>' : '') + '</div>' +
          '<div class="pm">' + money(p.price) + '/' + esc(p.unit || "份") + (p.spec ? ' · ' + esc(p.spec) : '') + ' · 排序 ' + p.sort_order + '</div></div>' +
          '<div class="acts">' +
          '<button class="btn btn-ghost btn-sm" data-edit="' + esc(p.id) + '">编辑</button>' +
          '<button class="btn btn-ghost btn-sm" data-toggle="' + esc(p.id) + '">' + (p.status === "in_stock" ? "标售罄" : "恢复上架") + '</button>' +
          '<button class="btn btn-danger btn-sm" data-del="' + esc(p.id) + '">删除</button>' +
          '</div></div>';
      }).join("");
      document.querySelectorAll("[data-edit]").forEach(function(b){
        b.addEventListener("click", function(){ editProduct(b.getAttribute("data-edit")); });
      });
      document.querySelectorAll("[data-toggle]").forEach(function(b){
        b.addEventListener("click", function(){ toggleSoldOut(b.getAttribute("data-toggle")); });
      });
      document.querySelectorAll("[data-del]").forEach(function(b){
        b.addEventListener("click", function(){ deleteProduct(b.getAttribute("data-del")); });
      });
    });
  }

  function editProduct(id){
    client.from("products").select("*").eq("id", id).single().then(function(res){
      if (res.error || !res.data){ $("productErr").textContent = "读取商品失败：" + (res.error ? res.error.message : "找不到该商品"); return; }
      var p = res.data;
      $("formTitle").textContent = "编辑商品";
      $("pId").value = p.id;
      $("pName").value = p.name || "";
      $("pPrice").value = p.price;
      $("pUnit").value = p.unit || "份";
      $("pSpec").value = p.spec || "";
      $("pOrigin").value = p.origin || "";
      $("pDesc").value = p.description || "";
      $("pImageUrl").value = p.image_url || "";
      $("pStatus").value = p.status || "in_stock";
      $("pSort").value = p.sort_order || 0;
      $("pFeatured").checked = !!p.featured;
      $("pImageFile").value = "";
      if (p.image_url){ $("pImagePreview").src = p.image_url; $("pImagePreview").classList.remove("hidden"); }
      else $("pImagePreview").classList.add("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  function toggleSoldOut(id){
    client.from("products").select("id,status").eq("id", id).single().then(function(res){
      if (res.error || !res.data) return;
      var next = res.data.status === "in_stock" ? "sold_out" : "in_stock";
      client.from("products").update({ status: next }).eq("id", id).then(function(r){
        if (r.error) alert("操作失败：" + r.error.message);
        else loadProducts();
      });
    });
  }

  function deleteProduct(id){
    var row = document.querySelector('[data-del="' + id + '"]');
    var name = row ? row.closest(".prow").querySelector(".pn").textContent : "";
    if (!confirm("确定要删除「" + name.trim() + "」吗？删除后顾客就看不到了。")) return;
    client.from("products").delete().eq("id", id).then(function(res){
      if (res.error) alert("删除失败：" + res.error.message);
      else loadProducts();
    });
  }

  $("pImageFile").addEventListener("change", function(){
    var f = $("pImageFile").files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(e){ $("pImagePreview").src = e.target.result; $("pImagePreview").classList.remove("hidden"); };
    reader.readAsDataURL(f);
  });

  function resetForm(){
    $("formTitle").textContent = "新增商品";
    ["pId","pName","pPrice","pSpec","pOrigin","pDesc","pImageUrl"].forEach(function(id){ $(id).value = ""; });
    $("pUnit").value = "半斤";
    $("pStatus").value = "in_stock";
    $("pSort").value = "0";
    $("pFeatured").checked = false;
    $("pImageFile").value = "";
    $("pImagePreview").classList.add("hidden");
    $("productErr").textContent = ""; $("productOk").textContent = "";
  }
  $("resetFormBtn").addEventListener("click", resetForm);

  $("productForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var err = $("productErr"), ok = $("productOk");
    err.textContent = ""; ok.textContent = "";
    var name = $("pName").value.trim();
    var price = parseFloat($("pPrice").value);
    if (!name){ err.textContent = "请填写商品名"; $("pName").focus(); return; }
    if (isNaN(price) || price < 0){ err.textContent = "请填写正确的价格"; $("pPrice").focus(); return; }
    var btn = $("saveProductBtn"); btn.disabled = true; btn.textContent = "正在保存…";
    var file = $("pImageFile").files[0];
    var uploadPromise = Promise.resolve($("pImageUrl").value || null);
    if (file){
      var safeName = file.name.replace(/[^\w.\-]/g, "_");
      var path = "products/" + Date.now() + "-" + safeName;
      $("uploadTip").textContent = "正在上传图片…";
      uploadPromise = client.storage.from(BUCKET).upload(path, file, { upsert: false }).then(function(res){
        if (res.error) throw new Error("图片上传失败：" + res.error.message);
        var pub = client.storage.from(BUCKET).getPublicUrl(path);
        return pub.data.publicUrl;
      });
    }
    uploadPromise.then(function(imageUrl){
      var data = {
        name: name,
        price: Math.round(price * 100) / 100,
        unit: $("pUnit").value,
        spec: $("pSpec").value.trim() || null,
        origin: $("pOrigin").value.trim() || null,
        description: $("pDesc").value.trim() || null,
        image_url: imageUrl,
        status: $("pStatus").value,
        featured: $("pFeatured").checked,
        sort_order: parseInt($("pSort").value, 10) || 0,
        updated_at: new Date().toISOString()
      };
      var id = $("pId").value;
      var q = id
        ? client.from("products").update(data).eq("id", id)
        : client.from("products").insert([data]);
      return q.then(function(res){
        if (res.error) throw new Error("保存失败：" + res.error.message);
      });
    }).then(function(){
      btn.disabled = false; btn.textContent = "保存商品";
      $("uploadTip").textContent = "选图后点保存时一起上传；不选图就用原来的图。";
      ok.textContent = "已保存 ✓";
      resetForm();
      loadProducts();
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "保存商品";
      $("uploadTip").textContent = "选图后点保存时一起上传；不选图就用原来的图。";
      err.textContent = e.message || "保存失败，请重试";
    });
  });

  /* ---------- 店铺设置 ---------- */
  var SETTINGS_KEYS = ["pickup_address", "delivery_campuses", "delivery_slots", "shop_notice"];
  var settingsState = {
    pickup_address: "天平学院门口",
    delivery_campuses: ["天平学院", "江枫校区"],
    delivery_slots: ["12:00", "17:40", "19:30"],
    shop_notice: ""
  };

  function renderChips(containerId, values, onRemove){
    var box = $(containerId);
    box.innerHTML = "";
    if (!values.length){ box.innerHTML = "<span class='muted'>暂无，可在下面添加</span>"; return; }
    values.forEach(function(v, i){
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = v;
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", "删除 " + v);
      x.addEventListener("click", function(){ onRemove(i); });
      chip.appendChild(x);
      box.appendChild(chip);
    });
  }
  function renderSettingsForm(){
    $("sPickup").value = settingsState.pickup_address || "";
    $("sNotice").value = settingsState.shop_notice || "";
    renderChips("sCampusChips", settingsState.delivery_campuses, function(i){ settingsState.delivery_campuses.splice(i, 1); renderSettingsForm(); });
    renderChips("sSlotChips", settingsState.delivery_slots, function(i){ settingsState.delivery_slots.splice(i, 1); renderSettingsForm(); });
  }
  function loadSettings(){
    client.from("fruit_settings").select("key,value").then(function(res){
      if (res.error){ $("settingsErr").textContent = "设置加载失败：" + res.error.message; renderSettingsForm(); return; }
      (res.data || []).forEach(function(row){
        if (!row || !row.key) return;
        if (row.key === "pickup_address" && typeof row.value === "string") settingsState.pickup_address = row.value;
        if (row.key === "delivery_campuses" && Array.isArray(row.value)) settingsState.delivery_campuses = row.value;
        if (row.key === "delivery_slots" && Array.isArray(row.value)) settingsState.delivery_slots = row.value;
        if (row.key === "shop_notice" && typeof row.value === "string") settingsState.shop_notice = row.value;
      });
      DELIVERY_LABEL.pickup = "自提（" + settingsState.pickup_address + "）";
      renderSettingsForm();
      loadOrders();
    });
  }
  $("sCampusAdd").addEventListener("click", function(){
    var v = $("sCampusInput").value.trim();
    if (!v) return;
    if (settingsState.delivery_campuses.indexOf(v) === -1) settingsState.delivery_campuses.push(v);
    $("sCampusInput").value = "";
    renderSettingsForm();
  });
  $("sSlotAdd").addEventListener("click", function(){
    var v = $("sSlotInput").value.trim();
    if (!v) return;
    if (settingsState.delivery_slots.indexOf(v) === -1) settingsState.delivery_slots.push(v);
    $("sSlotInput").value = "";
    renderSettingsForm();
  });
  $("saveSettingsBtn").addEventListener("click", function(){
    var err = $("settingsErr"), ok = $("settingsOk");
    err.textContent = ""; ok.textContent = "";
    var pickup = $("sPickup").value.trim();
    if (!pickup){ err.textContent = "请填写自提地址"; $("sPickup").focus(); return; }
    if (!settingsState.delivery_campuses.length){ err.textContent = "至少保留一个配送校区"; return; }
    if (!settingsState.delivery_slots.length){ err.textContent = "至少保留一个配送时间"; return; }
    var values = {
      pickup_address: pickup,
      delivery_campuses: settingsState.delivery_campuses.slice(),
      delivery_slots: settingsState.delivery_slots.slice(),
      shop_notice: $("sNotice").value.trim()
    };
    var btn = $("saveSettingsBtn"); btn.disabled = true; btn.textContent = "正在保存…";
    var now = new Date().toISOString();
    var jobs = SETTINGS_KEYS.map(function(k){
      return client.from("fruit_settings").upsert({ key: k, value: values[k], updated_at: now }).then(function(res){
        if (res.error) throw new Error(res.error.message);
      });
    });
    Promise.all(jobs).then(function(){
      btn.disabled = false; btn.textContent = "保存设置";
      settingsState.pickup_address = values.pickup_address;
      settingsState.delivery_campuses = values.delivery_campuses.slice();
      settingsState.delivery_slots = values.delivery_slots.slice();
      settingsState.shop_notice = values.shop_notice;
      DELIVERY_LABEL.pickup = "自提（" + values.pickup_address + "）";
      ok.textContent = "已保存 ✓ 顾客那边立刻生效";
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "保存设置";
      err.textContent = "保存失败：" + (e.message || "请重试");
    });
  });
  renderSettingsForm();

  /* ---------- 订单 ---------- */
  function loadOrders(){
    client.from("fruit_orders").select("*").order("created_at", { ascending: false }).limit(100).then(function(res){
      if (res.error){
        $("ordersErr").textContent = "订单加载失败：" + res.error.message + "（需要管理员登录；如果刚登录，请刷新页面重试）";
        $("orderList").innerHTML = "";
        return;
      }
      $("ordersErr").textContent = "";
      var list = res.data || [];
      var newCount = list.filter(function(o){ return o.status === "new"; }).length;
      $("newOrderCount").textContent = newCount ? "（" + newCount + " 个待接单）" : "";
      if (!list.length){ $("orderList").innerHTML = "<p class='muted'>还没有订单。</p>"; return; }
      $("orderList").innerHTML = list.map(function(o){
        var items = Array.isArray(o.items) ? o.items : [];
        var itemsHtml = items.map(function(it){
          return esc(it.name) + " ×" + it.qty + "（" + money(Number(it.price) * it.qty) + "）";
        }).join("<br>");
        var acts = "";
        if (o.status === "new") acts += '<button class="btn btn-green btn-sm" data-st="' + esc(o.id) + '|confirmed">接单</button>';
        if (o.status === "new") acts += '<button class="btn btn-danger btn-sm" data-st="' + esc(o.id) + '|cancelled">拒单</button>';
        if (o.status === "confirmed") acts += '<button class="btn btn-green btn-sm" data-st="' + esc(o.id) + '|ready">备好了</button>';
        if (o.status === "ready") acts += '<button class="btn btn-green btn-sm" data-st="' + esc(o.id) + '|done">完成订单</button>';
        if (o.status === "confirmed" || o.status === "ready") acts += '<button class="btn btn-danger btn-sm" data-st="' + esc(o.id) + '|cancelled">取消订单</button>';
        return '<div class="order">' +
          '<div class="oh"><span class="ono">' + esc(o.order_no) + ' <span class="pill status-' + esc(o.status) + '">' + esc(statusLabel(o)) + '</span></span>' +
          '<span class="ot">' + esc(fmtTime(o.created_at)) + '</span></div>' +
          '<div class="ol">姓名：' + esc(o.customer_name) + ' · 电话：' + esc(o.phone) + '<br>' +
          '配送：' + esc(DELIVERY_LABEL[o.delivery_type] || o.delivery_type) + (o.delivery_type === "delivery" ? (o.campus ? ' · ' + esc(o.campus) : '') + (o.building ? ' · ' + esc(o.building) : '') : '') + ' · 时间：' + esc(o.delivery_slot || "") + '<br>' +
          '付款：' + esc(PAY_LABEL[o.payment_method] || o.payment_method) + ' · 合计：<strong>' + money(o.total) + '</strong></div>' +
          '<div class="oi">' + itemsHtml + '</div>' +
          (acts ? '<div class="oacts">' + acts + '</div>' : '') +
          '</div>';
      }).join("");
      document.querySelectorAll("[data-st]").forEach(function(b){
        b.addEventListener("click", function(){
          var parts = b.getAttribute("data-st").split("|");
          setOrderStatus(parts[0], parts[1]);
        });
      });
    });
  }

  function setOrderStatus(id, status){
    client.from("fruit_orders").update({ status: status }).eq("id", id).then(function(res){
      if (res.error) alert("操作失败：" + res.error.message);
      else loadOrders();
    });
  }

  /* ---------- 启动：恢复登录态 ---------- */
  client.auth.getSession().then(function(res){
    if (res.data && res.data.session && res.data.session.user) showAdmin(res.data.session.user);
    else showLogin();
  });
  client.auth.onAuthStateChange(function(event, session){
    if (event === "SIGNED_OUT") showLogin();
    else if (session && session.user && $("adminView").classList.contains("hidden")) showAdmin(session.user);
  });
})();
</script>
</body>
</html>
